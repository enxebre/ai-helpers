name: Plugin Evals

on:
  pull_request:
  issue_comment:
    types: [created]

permissions: {}

env:
  CLAUDE_CODE_USE_VERTEX: 'true'

jobs:
  detect-changed-plugins:
    # Run on: any pull_request, OR /run-evals comment from org member
    if: >-
      github.event_name == 'pull_request' ||
      (github.event.issue.pull_request &&
       contains(github.event.comment.body, '/run-evals') &&
       (github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR'))
    runs-on: ubuntu-latest
    outputs:
      plugins: ${{ steps.detect.outputs.plugins }}
      has_plugins: ${{ steps.detect.outputs.has_plugins }}
      pr_ref: ${{ steps.refs.outputs.pr_ref }}
    steps:
      - name: Resolve PR refs
        id: refs
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base_ref=${{ github.base_ref }}" >> "$GITHUB_OUTPUT"
            echo "pr_ref=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            PR_DATA=$(gh pr view ${{ github.event.issue.number }} --json baseRefName,headRefOid)
            echo "base_ref=$(echo $PR_DATA | jq -r '.baseRefName')" >> "$GITHUB_OUTPUT"
            echo "pr_ref=refs/pull/${{ github.event.issue.number }}/merge" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ steps.refs.outputs.pr_ref }}
          persist-credentials: false
          fetch-depth: 0

      - name: Detect changed plugins with evals
        id: detect
        run: |
          plugins=$(git diff --name-only origin/${{ steps.refs.outputs.base_ref }}...HEAD -- plugins/ \
            | sed -n 's|^plugins/\([^/]*\)/.*|\1|p' \
            | sort -u \
            | while read plugin; do
                [ -d "plugins/${plugin}/evals" ] && echo "$plugin"
              done \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "plugins=${plugins}" >> "$GITHUB_OUTPUT"
          if [ "$plugins" = "[]" ] || [ -z "$plugins" ]; then
            echo "has_plugins=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_plugins=true" >> "$GITHUB_OUTPUT"
          fi
          echo "Changed plugins with evals: ${plugins}"

  behavioral-evals:
    needs: detect-changed-plugins
    if: needs.detect-changed-plugins.outputs.has_plugins == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJson(needs.detect-changed-plugins.outputs.plugins) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.detect-changed-plugins.outputs.pr_ref }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Authenticate to GCP
        uses: google-github-actions/auth@ba79af03959ebeac9769e648f473a284504d9193 # v2.1.10
        with:
          credentials_json: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}

      - name: Run behavioral evals for ${{ matrix.plugin }}
        env:
          ANTHROPIC_VERTEX_PROJECT_ID: ${{ secrets.ANTHROPIC_VERTEX_PROJECT_ID }}
          EVAL_OUTPUT_DIR: ${{ github.workspace }}/eval-results
        run: |
          mkdir -p "$EVAL_OUTPUT_DIR"
          make eval-plugins EVAL_PLUGIN=${{ matrix.plugin }}

      - name: Publish eval report
        if: always()
        uses: dorny/test-reporter@4a2e97665d5fa767581ef38eca97b9694bd4eef4 # v2
        with:
          name: "Eval: ${{ matrix.plugin }}"
          path: eval-results/*.xml
          reporter: java-junit

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: eval-results-${{ matrix.plugin }}
          path: eval-results/*.xml
          retention-days: 30
